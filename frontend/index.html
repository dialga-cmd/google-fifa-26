<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self';">
    <title>CivicPulse - Infrastructure Complaint Intake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CivicPulse</h1>
    <p>Infrastructure complaint intake system</p>

    <div id="call-container" aria-live="polite" aria-atomic="true">
        <div id="call-settings">
            <div class="settings-title">Issue category</div>
            <div class="settings-control">
                <label for="category-select" class="visually-hidden">Select issue category</label>
                <select id="category-select" aria-label="Select issue category">
                    <option value="" disabled selected>Loading categories...</option>
                    <option value="road">Road problem</option>
                    <option value="water">Water issue</option>
                    <option value="electricity">Electricity fault</option>
                    <option value="sanitation">Sanitation problem</option>
                </select>
            </div>
        </div>
        <div id="messages" aria-label="Chat messages"></div>
        <div id="urgency-display" aria-live="polite">
            <strong>Urgency:</strong> <span id="urgency-text" aria-live="polite"></span>
        </div>
    </div>

    <div id="input-container" aria-live="polite">
        <div id="meta-row">
            <div class="input-group">
                <label for="location-input">Location/Description</label>
                <input type="text" id="location-input" placeholder="Describe the location and extent of the issue..." aria-label="Describe the location and extent of the issue..." autocomplete="off">
            </div>
            <div class="input-group">
                <label for="contact-input">Citizen name (optional)</label>
                <input type="text" id="contact-input" placeholder="Name" aria-label="Citizen name" autocomplete="off">
            </div>
        </div>
        <label for="query-input" class="visually-hidden">Describe the infrastructure issue</label>
        <input type="text" id="query-input" placeholder="Describe the infrastructure issue..." aria-label="Describe the infrastructure issue..." autocomplete="off">
       scode
        <div id="send-row">
            <button id="send-btn" aria-label="Send">Send</button>
        </div>
    </div>

    <div id="status" class="status ready" aria-live="polite">Ready</div>

    <script src="app.js"></script>
</body>
</html>
